<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stylized aluminium door illustration">
  <defs>
    <linearGradient id="frameGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#e8f4ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#bfe1ff" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="800" fill="#f5f7fa"/>

  <!-- door group -->
  <g transform="translate(200,80)" filter="url(#softShadow)">
    <!-- outer frame -->
    <rect x="0" y="0" width="600" height="640" rx="10" ry="10" fill="url(#frameGrad)" stroke="#7b8a90" stroke-width="4"/>

    <!-- inner inset to simulate recessed frame -->
    <rect x="20" y="20" width="560" height="600" rx="6" ry="6" fill="#eef3f6"/>

    <!-- big glass panel -->
    <rect x="60" y="60" width="480" height="480" rx="6" ry="6" fill="url(#glassGrad)" stroke="#b6d3ef" stroke-width="2"/>

    <!-- horizontal mullion -->
    <rect x="60" y="310" width="480" height="10" fill="#c6d4db" opacity="0.6"/>

    <!-- bottom kick plate -->
    <rect x="60" y="560" width="480" height="80" rx="4" ry="4" fill="#dae3e7"/>

    <!-- handle bar -->
    <g transform="translate(520,320) rotate(90)">
      <rect x="-6" y="-70" width="12" height="140" rx="6" ry="6" fill="#7c8b90"/>
      <rect x="-18" y="-54" width="36" height="18" rx="8" ry="8" fill="#546168"/>
    </g>

    <!-- subtle reflection lines on glass -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2">
      <path d="M90 90 C180 70, 320 130, 520 110"/>
      <path d="M110 130 C220 110, 360 160, 520 150" opacity="0.6"/>
    </g>

    <!-- company badge on top-left of frame -->
    <g transform="translate(24,12)">
      <rect x="0" y="0" width="110" height="36" rx="6" ry="6" fill="#0d6efd"/>
      <text x="55" y="23" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#fff">Mohali Fabrication</text>
    </g>
  </g>

  <!-- descriptive text (optional) -->
  <g transform="translate(840,160)">
    <text x="0" y="0" font-family="Segoe UI, Roboto, Arial" font-size="28" fill="#24303a">Aluminium Door — Custom Fabrication</text>
    <text x="0" y="40" font-family="Segoe UI, Roboto, Arial" font-size="18" fill="#4b5b62">Precision frames, double glazing and professional installation.</text>
  </g>
</svg>